<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Game Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f8fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.3);
            --success: #2ecc71;
            --danger: #e74c3c;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
            transition: var(--transition);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .container { max-width: 520px; margin: 0 auto; padding: 16px 16px 0; }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background-image: url('https://files.catbox.moe/b66gyb.jpg');
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
        .logo-text .premium { font-weight: 800; font-size: 0.95rem; letter-spacing: -0.3px; }
        .logo-text .shop { font-size: 0.55rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
        .icon-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 12px;
            color: var(--text-secondary); cursor: pointer; position: relative;
            font-size: 0.95rem; display: flex; align-items: center; justify-content: center;
            transition: var(--transition); text-decoration: none;
        }
        .icon-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .badge {
            position: absolute; top: -4px; right: -4px; background: var(--danger);
            color: #fff; font-size: 0.55rem; width: 17px; height: 17px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .lang-toggle {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; height: 38px; padding: 0 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; cursor: pointer;
            color: var(--text-secondary); transition: var(--transition); white-space: nowrap;
        }
        .lang-toggle:hover { color: var(--text-primary); background: var(--bg-card-hover); }
        .login-btn {
            background: linear-gradient(135deg, #7c5cff, #4f46e5);
            color: #fff; border: none; border-radius: 12px;
            height: 38px; padding: 0 14px; display: flex; align-items: center; gap: 6px;
            font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: var(--transition);
            white-space: nowrap;
        }
        .login-btn:hover { box-shadow: 0 4px 15px var(--accent-glow); }

        /* Hero */
        .hero { text-align: center; margin-bottom: 20px; }
        .hero .welcome {
            font-size: 0.7rem; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 6px;
        }
        .hero h1 {
            font-size: 1.9rem; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #7c5cff, #4f46e5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; line-height: 1.1; margin-bottom: 4px;
        }
        .hero .sub { color: var(--text-secondary); font-size: 0.85rem; }

        /* Shop Status */
        .shop-status {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 14px 16px; border-radius: var(--radius-md); margin-bottom: 20px;
            font-weight: 700; font-size: 0.8rem; transition: var(--transition);
        }
        .shop-status.open {
            background: rgba(46, 204, 113, 0.1); color: #16a34a;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .shop-status.closed {
            background: rgba(239, 68, 68, 0.1); color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .status-light {
            width: 10px; height: 10px; border-radius: 50%;
            background: currentColor; box-shadow: 0 0 12px currentColor;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Go To Shop Hero Card */
        .go-shop-card {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 28px;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            aspect-ratio: 1.7 / 1;
            display: flex;
            align-items: flex-end;
            transition: var(--transition);
            background: #0f0f14;
            border: 1px solid rgba(124, 92, 255, 0.2);
        }
        .go-shop-card:hover {
            box-shadow: 0 20px 60px rgba(124, 92, 255, 0.3);
            transform: translateY(-3px);
        }
        .go-shop-card .card-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://files.catbox.moe/23y1zs.png');
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }
        .go-shop-card:hover .card-bg {
            transform: scale(1.03);
        }
        .go-shop-card .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                to top,
                rgba(10, 10, 20, 0.85) 0%,
                rgba(10, 10, 20, 0.4) 40%,
                rgba(10, 10, 20, 0.1) 70%,
                transparent 100%
            );
            z-index: 1;
        }
        .go-shop-card .card-content {
            position: relative;
            z-index: 2;
            padding: 20px 22px;
            width: 100%;
        }
        .go-shop-card .card-content h2 {
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .go-shop-card .card-content p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.78rem;
            margin-bottom: 12px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .go-shop-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a1a;
            border: none;
            padding: 12px 22px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(124, 92, 255, 0.4);
        }
        .go-shop-btn:hover {
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(124, 92, 255, 0.6);
            transform: translateY(-2px);
        }
        .go-shop-btn i {
            font-size: 0.75rem;
            transition: transform 0.3s ease;
        }
        .go-shop-btn:hover i {
            transform: translateX(4px);
        }

        /* Services */
        .section-title {
            font-size: 0.65rem; font-weight: 700; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::after {
            content: ''; flex: 1; height: 1px; background: var(--border-color);
        }
        .services-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 24px;
        }
        .service-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 18px 10px 14px;
            text-align: center; cursor: pointer; transition: var(--transition);
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; min-height: 100px;
        }
        .service-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .service-card .icon { font-size: 1.6rem; }
        .service-card .label {
            font-size: 0.55rem; color: var(--text-secondary);
            font-weight: 500; line-height: 1.3;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 520px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 6px 8px; z-index: 100;
            box-shadow: var(--shadow-lg);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--text-secondary); text-decoration: none;
            padding: 8px 12px; border-radius: 30px; transition: var(--transition);
            font-size: 0.62rem; border: none; background: none; cursor: pointer;
        }
        .nav-item i { font-size: 1.05rem; }
        .nav-item.active {
            color: #ffffff;
            background: #1a1a1a;
            font-weight: 700;
        }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            z-index: 200; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-sheet {
            background: var(--bg-card); width: 100%; max-width: 520px;
            border-radius: 28px 28px 0 0; padding: 20px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab {
            flex: 1; text-align: center; padding: 10px; border-radius: 12px;
            font-weight: 700; cursor: pointer; background: var(--bg-card-hover);
            color: var(--text-secondary); border: none; font-size: 0.8rem;
        }
        .auth-tab.active {
            background: linear-gradient(135deg, #7c5cff, #4f46e5);
            color: #fff;
        }
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block; font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 4px;
        }
        .form-group input {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--bg-primary);
            color: var(--text-primary); outline: none; font-size: 0.85rem;
        }
        .btn-submit {
            width: 100%; padding: 13px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #7c5cff, #4f46e5);
            color: #fff; font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 0.85rem;
        }

        /* Desktop */
        @media (min-width: 768px) {
            .container { max-width: 720px; }
            .go-shop-card { aspect-ratio: 2.5 / 1; }
            .go-shop-card .card-content h2 { font-size: 1.6rem; }
            .go-shop-card .card-content p { font-size: 0.85rem; }
            .bottom-nav { max-width: 720px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-area">
                <div class="logo-img"></div>
                <div class="logo-text">
                    <span class="premium" data-i18n="brandName">Premium</span>
                    <span class="shop" data-i18n="brandSub">Game Shop</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="lang-toggle" id="langToggle">MM</button>
                <a href="#" class="icon-btn" id="notiBtn"><i class="fa-regular fa-bell"></i><span class="badge">3</span></a>
                <button class="login-btn" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i><span data-i18n="login">Login</span></button>
            </div>
        </header>

        <!-- Hero -->
        <div class="hero">
            <p class="welcome" data-i18n="welcomeHero">Welcome To Premium Game Shop</p>
            <h1>Level Up Your Game</h1>
            <p class="sub" data-i18n="heroSub">Top up diamonds, UC, Telegram & more</p>
        </div>

        <!-- Shop Status -->
        <div class="shop-status open" id="shopStatus">
            <span class="status-light"></span>
            <span id="statusText">🟢 OPEN — 09:00 AM to 09:00 PM</span>
        </div>

        <!-- GO TO SHOP HERO CARD -->
        <div class="go-shop-card" onclick="location.href='shop.html'">
            <div class="card-bg"></div>
            <div class="overlay"></div>
            <div class="card-content">
                <h2 data-i18n="goShopTitle">Premium Game Shop</h2>
                <p data-i18n="goShopDesc">Everything you need, all in one place.</p>
                <span class="go-shop-btn">
                    <span data-i18n="goShopBtn">Go To Shop</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </span>
            </div>
        </div>

        <!-- Services -->
        <div class="section-title" data-i18n="servicesTitle">Our Services</div>
        <div class="services-grid" id="servicesGrid"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i><span data-i18n="navHome">Home</span></a>
        <a href="news.html" class="nav-item"><i class="fa-solid fa-newspaper"></i><span data-i18n="navNews">News</span></a>
        <a href="shop.html" class="nav-item"><i class="fa-solid fa-bag-shopping"></i><span data-i18n="navShop">Shop</span></a>
        <a href="payment.html" class="nav-item"><i class="fa-solid fa-credit-card"></i><span data-i18n="navPayment">Payment</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span data-i18n="navProfile">Profile</span></a>
    </nav>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 data-i18n="authTitle">Welcome Back</h2>
                <button class="icon-btn" onclick="closeAuth()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login" data-i18n="loginTab">Login</button>
                <button class="auth-tab" data-tab="register" data-i18n="registerTab">Register</button>
            </div>
            <div class="form-group">
                <label data-i18n="emailPhone">Email / Phone</label>
                <input type="text" placeholder="Enter email or phone">
            </div>
            <div class="form-group">
                <label data-i18n="password">Password</label>
                <input type="password" placeholder="Enter password">
            </div>
            <button class="btn-submit" data-i18n="loginBtn">Login</button>
        </div>
    </div>

    <script>
        const I18N = {
            en: {
                brandName: "Premium", brandSub: "Game Shop",
                login: "Login", welcomeHero: "Welcome To Premium Game Shop",
                heroSub: "Top up diamonds, UC, Telegram & more",
                open: "🟢 OPEN — 09:00 AM to 09:00 PM",
                closed: "🔴 CLOSED — Opens at 09:00 AM",
                goShopTitle: "Premium Game Shop",
                goShopDesc: "Everything you need, all in one place.",
                goShopBtn: "Go To Shop", servicesTitle: "Our Services",
                navHome: "Home", navNews: "News", navShop: "Shop",
                navPayment: "Payment", navProfile: "Profile",
                authTitle: "Welcome Back", loginTab: "Login", registerTab: "Register",
                emailPhone: "Email / Phone", password: "Password", loginBtn: "Login",
                registerBtn: "Register",
                s1: "Instant Delivery", s2: "Secure Payment",
                s3: "24/7 Support", s4: "Best Prices",
                s5: "Trusted Shop", s6: "Fast Service"
            },
            my: {
                brandName: "Premium", brandSub: "Game Shop",
                login: "လော့အင်", welcomeHero: "Premium Game Shop မှ ကြိုဆိုပါသည်",
                heroSub: "ဒိုင်းမွန်၊ UC၊ Telegram နှင့် အခြား",
                open: "🟢 ဖွင့်ထားသည် — မနက် ၉ မှ ည ၉",
                closed: "🔴 ပိတ်ထားသည် — မနက် ၉ မှ ပြန်ဖွင့်မည်",
                goShopTitle: "ပရီမီယံဂိမ်းဆိုင်",
                goShopDesc: "လိုအပ်သမျှ အားလုံး တစ်နေရာတည်းတွင်။",
                goShopBtn: "ဆိုင်သို့သွားမည်", servicesTitle: "ကျွန်ုပ်တို့၏ ဝန်ဆောင်မှုများ",
                navHome: "ပင်မ", navNews: "သတင်းများ", navShop: "ဆိုင်",
                navPayment: "ငွေပေးချေ", navProfile: "ပရိုဖိုင်",
                authTitle: "ပြန်လည်ကြိုဆိုပါတယ်", loginTab: "လော့အင်", registerTab: "မှတ်ပုံတင်မည်",
                emailPhone: "အီးမေးလ် / ဖုန်း", password: "စကားဝှက်", loginBtn: "လော့အင်",
                registerBtn: "မှတ်ပုံတင်မည်",
                s1: "ချက်ချင်းပို့ဆောင်မှု", s2: "လုံခြုံသောငွေပေးချေမှု",
                s3: "၂၄/၇ အကူအညီ", s4: "အကောင်းဆုံးစျေးနှုန်း",
                s5: "ယုံကြည်စိတ်ချရသောဆိုင်", s6: "မြန်ဆန်သောဝန်ဆောင်မှု"
            }
        };

        let currentLang = localStorage.getItem('lang') || 'en';

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (I18N[currentLang][key]) el.textContent = I18N[currentLang][key];
            });
            updateShopStatus();
            renderServices();
        }

        function updateShopStatus() {
            const now = new Date();
            const min = now.getHours() * 60 + now.getMinutes();
            const statusEl = document.getElementById('shopStatus');
            const statusText = document.getElementById('statusText');
            if (min >= 540 && min < 1260) {
                statusEl.className = 'shop-status open';
                statusText.textContent = I18N[currentLang].open;
            } else {
                statusEl.className = 'shop-status closed';
                statusText.textContent = I18N[currentLang].closed;
            }
        }

        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            const services = [
                { icon: '⚡', key: 's1' },
                { icon: '🔒', key: 's2' },
                { icon: '💬', key: 's3' },
                { icon: '💰', key: 's4' },
                { icon: '🏆', key: 's5' },
                { icon: '🚀', key: 's6' }
            ];
            grid.innerHTML = services.map(s => `
                <div class="service-card">
                    <span class="icon">${s.icon}</span>
                    <span class="label">${I18N[currentLang][s.key]}</span>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyLanguage();
            updateShopStatus();
            renderServices();
            setInterval(updateShopStatus, 60000);

            document.getElementById('langToggle').addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'my' : 'en';
                localStorage.setItem('lang', currentLang);
                document.getElementById('langToggle').textContent = currentLang === 'en' ? 'MM' : 'EN';
                applyLanguage();
            });
            document.getElementById('langToggle').textContent = currentLang === 'en' ? 'MM' : 'EN';

            document.getElementById('loginBtn').addEventListener('click', () => {
                document.getElementById('authModal').classList.add('active');
            });

            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });

        function closeAuth() {
            document.getElementById('authModal').classList.remove('active');
        }
        document.getElementById('authModal').addEventListener('click', function(e) {
            if (e.target === this) closeAuth();
        });
    </script>
</body>
</html>
