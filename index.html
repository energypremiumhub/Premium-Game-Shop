<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Game Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f8fa;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.3);
            --success: #2ecc71;
            --danger: #e74c3c;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans Myanmar', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .container { max-width: 520px; margin: 0 auto; padding: 16px 16px 0; }

        /* Header */
        .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .user-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #7c5cff, #4f46e5);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #fff; flex-shrink: 0;
        }
        .user-text { display: flex; flex-direction: column; line-height: 1.2; }
        .user-text .name {
            font-weight: 800; font-size: 14px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
        }
        .user-text .status { font-size: 11px; color: var(--text-secondary); }
        .header-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .header-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; height: 38px; min-width: 38px; padding: 0 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: var(--text-secondary); cursor: pointer;
            transition: var(--transition); position: relative; text-decoration: none;
            white-space: nowrap; outline: none;
        }
        .header-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .header-btn:active { transform: scale(0.94); }
        .lang-btn { font-weight: 700; font-size: 11px; }
        .badge {
            position: absolute; top: -4px; right: -4px; background: var(--danger);
            color: #fff; font-size: 9px; width: 17px; height: 17px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .login-btn {
            background: linear-gradient(135deg, #7c5cff, #4f46e5); color: #fff;
            border: none; border-radius: 12px; height: 38px; padding: 0 14px;
            display: flex; align-items: center; gap: 6px; font-weight: 700;
            font-size: 11px; cursor: pointer; transition: var(--transition); white-space: nowrap;
        }
        .login-btn:hover { box-shadow: 0 4px 15px var(--accent-glow); }
        .login-btn.hidden { display: none; }

        /* Hero */
        .hero { text-align: left; margin-bottom: 20px; }
        .hero .welcome {
            font-size: 11px; color: var(--text-secondary); text-transform: uppercase;
            letter-spacing: 2px; font-weight: 600; margin-bottom: 6px;
        }
        .hero h1 {
            font-size: 32px; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #7c5cff, #4f46e5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; line-height: 1.1; margin-bottom: 4px;
        }
        .hero .sub { color: var(--text-secondary); font-size: 13px; }

        /* Shop Status Banner */
        .status-banner {
            position: relative; border-radius: var(--radius-lg); overflow: hidden;
            margin-bottom: 20px; padding: 0; background: #0f0f14;
            box-shadow: var(--shadow-lg); display: flex; align-items: stretch;
            min-height: 80px; border: 1px solid var(--border-color);
        }
        .status-banner .bg-image {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://files.catbox.moe/4317os.jpg');
            background-size: cover; background-position: center;
        }
        .status-banner .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 100%);
            z-index: 1;
        }
        .status-content {
            position: relative; z-index: 2; display: flex; align-items: center;
            gap: 14px; padding: 12px 16px; width: 100%;
        }
        .status-light {
            width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
            background: currentColor; box-shadow: 0 0 12px currentColor;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .status-banner.open .status-light { color: #2ecc71; }
        .status-banner.closed .status-light { color: #e74c3c; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        .status-text { display: flex; flex-direction: column; color: #fff; min-width: 0; }
        .status-text .line1 {
            font-weight: 800; font-size: 14px; letter-spacing: -0.3px;
            text-shadow: 0 0 8px currentColor; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .status-banner.open .status-text .line1 { color: #2ecc71; }
        .status-banner.closed .status-text .line1 { color: #e74c3c; }
        .status-text .line2 {
            font-size: 10px; color: rgba(255, 255, 255, 0.85); font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        /* Go To Shop Card */
        .go-shop-card {
            position: relative; border-radius: var(--radius-lg); overflow: hidden;
            margin-bottom: 16px; box-shadow: var(--shadow-lg); cursor: pointer;
            aspect-ratio: 1.7 / 1; display: flex; align-items: flex-end;
            background: #0f0f14; border: 1px solid rgba(124, 92, 255, 0.2);
        }
        .go-shop-card .card-bg {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://files.catbox.moe/b66gyb.jpg');
            background-size: cover; background-position: center;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .go-shop-card .card-bg.zoomed { transform: scale(1.08); }
        .go-shop-card .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(10,10,20,0.85) 0%, rgba(10,10,20,0.4) 40%, rgba(10,10,20,0.1) 70%, transparent 100%);
            z-index: 1; pointer-events: none;
        }
        .go-shop-card .card-content {
            position: relative; z-index: 2; padding: 20px 22px; width: 100%;
            pointer-events: none;
        }
        .go-shop-card .card-content h2 {
            color: #fff; font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
            margin-bottom: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .go-shop-card .card-content p {
            color: rgba(255,255,255,0.85); font-size: 12px; margin-bottom: 12px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .go-shop-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.95); color: #1a1a1a; border: none;
            padding: 12px 22px; border-radius: 100px; font-weight: 700;
            font-size: 12px; cursor: pointer; transition: var(--transition);
            text-decoration: none; box-shadow: 0 4px 20px rgba(124,92,255,0.4);
            pointer-events: auto;
        }
        .go-shop-btn:hover { background: #fff; box-shadow: 0 8px 30px rgba(124,92,255,0.6); }
        .go-shop-btn i { font-size: 11px; transition: transform 0.3s ease; }
        .go-shop-btn:hover i { transform: translateX(4px); }

        /* Promo Carousel */
        .promo-scroll {
            display: flex; gap: 10px; overflow-x: auto;
            scroll-snap-type: x mandatory; padding-bottom: 8px;
            margin-bottom: 24px; scrollbar-width: none; -ms-overflow-style: none;
        }
        .promo-scroll::-webkit-scrollbar { display: none; }
        .promo-box {
            scroll-snap-align: start; min-width: 48%; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 16px 14px; text-align: center; box-shadow: var(--shadow-sm);
            transition: var(--transition); cursor: pointer; flex-shrink: 0;
        }
        .promo-box:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
        .promo-box .icon { font-size: 24px; color: var(--accent); margin-bottom: 8px; }
        .promo-box h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .promo-box p { font-size: 10px; color: var(--text-secondary); }

        /* Services */
        .section-title {
            font-size: 10px; font-weight: 700; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
        .section-title i { color: var(--accent); font-size: 12px; }
        .services-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 24px;
        }
        .service-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 18px 10px 14px; text-align: center;
            cursor: pointer; transition: var(--transition); display: flex;
            flex-direction: column; align-items: center; gap: 8px; min-height: 100px;
        }
        .service-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
        .service-card .icon { font-size: 22px; color: var(--accent); }
        .service-card .label {
            font-size: 9px; color: var(--text-secondary); font-weight: 500;
            line-height: 1.3; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 100%;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 520px; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px); border: 1px solid var(--border-color);
            border-radius: 40px; display: flex; justify-content: space-around;
            align-items: center; padding: 6px 8px; z-index: 100; box-shadow: var(--shadow-lg);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: var(--text-secondary); text-decoration: none; padding: 8px 12px;
            border-radius: 30px; transition: var(--transition); font-size: 10px;
            border: none; background: none; cursor: pointer;
        }
        .nav-item i { font-size: 16px; }
        .nav-item.active { color: #fff; background: #1a1a1a; font-weight: 700; }

        /* Modals */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            z-index: 200; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-sheet {
            background: var(--bg-card); width: 100%; max-width: 520px;
            border-radius: 28px 28px 0 0; padding: 20px; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .auth-tab {
            flex: 1; text-align: center; padding: 10px; border-radius: 12px;
            font-weight: 700; cursor: pointer; background: var(--bg-card-hover);
            color: var(--text-secondary); border: none; font-size: 13px; transition: var(--transition);
        }
        .auth-tab.active { background: linear-gradient(135deg, #7c5cff, #4f46e5); color: #fff; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
        .form-group input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);
            background: var(--bg-primary); color: var(--text-primary); outline: none;
            font-size: 13px; transition: var(--transition);
        }
        .btn-submit {
            width: 100%; padding: 13px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #7c5cff, #4f46e5); color: #fff;
            font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 13px;
        }
        .forgot-link a { color: var(--accent); font-size: 10px; }
        .switch-link { font-size: 11px; }

        /* Desktop */
        @media (min-width: 768px) {
            .container { max-width: 720px; }
            .go-shop-card { aspect-ratio: 2.5 / 1; }
            .go-shop-card .card-content h2 { font-size: 28px; }
            .go-shop-card .card-content p { font-size: 14px; }
            .bottom-nav { max-width: 720px; }
        }
    </style>
</head>
<body>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav"> ... </nav>

    <!-- Modals (same as before) -->

</html>
