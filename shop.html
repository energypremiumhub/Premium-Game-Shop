<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | Premium Game Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f9f9fb;
            --bg-input: #f5f5f7;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: rgba(0, 0, 0, 0.08);
            --border-color-light: rgba(0, 0, 0, 0.12);
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 36px rgba(0, 0, 0, 0.10);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.12);
            --text-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
            --text-shadow-strong: 0 2px 4px rgba(0, 0, 0, 0.08);
            --accent: #1a1a1a;
            --accent-secondary: #333333;
            --cyan: #00b4d8;
            --purple: #7c3aed;
            --red: #dc2626;
            --green: #16a34a;
            --nav-dark: #1a1a1a;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-pill: 30px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans Myanmar', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary); color: var(--text-primary); min-height: 100vh;
            padding: 16px; padding-bottom: 100px; -webkit-tap-highlight-color: transparent;
            line-height: 1.5; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
        }
        .container { max-width: 480px; margin: 0 auto; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceClick { 0% { transform: scale(1); } 50% { transform: scale(0.92); } 100% { transform: scale(1); } }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
        @keyframes toastPop { from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.9); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }

        .gradient-text {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-wrap { display: flex; align-items: center; gap: 10px; }
        .logo-wrap img { height: 38px; width: auto; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: var(--shadow-xs); }
        .logo-text-group { display: flex; flex-direction: column; line-height: 1.1; }
        .logo-premium { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; text-shadow: var(--text-shadow); }
        .logo-sub { font-size: 0.5rem; font-weight: 500; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        .header-right { display: flex; align-items: center; gap: 8px; }

        /* Lang Toggle */
        .lang-toggle {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.55rem; font-weight: 700; color: var(--text-secondary);
            transition: var(--transition); padding: 0; outline: none; box-shadow: var(--shadow-xs);
            user-select: none; -webkit-user-select: none;
        }
        .lang-toggle:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border-color-light); box-shadow: var(--shadow-sm); }
        .lang-toggle:active { transform: scale(0.94); background: var(--bg-card-hover); }

        /* Icon Btn */
        .icon-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1rem; color: var(--text-secondary); transition: var(--transition);
            text-decoration: none; position: relative; box-shadow: var(--shadow-xs);
        }
        .icon-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border-color-light); box-shadow: var(--shadow-sm); }
        .icon-btn:active { transform: scale(0.94); }
        .badge {
            position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff; font-size: 0.45rem;
            font-weight: 700; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 2px solid var(--bg-primary); display: none; padding: 0 4px; box-shadow: 0 2px 6px rgba(220,38,38,0.3);
        }

        /* Auth */
        .auth-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary);
            padding: 8px 16px; border-radius: 8px; font-size: 0.65rem; font-weight: 500; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; height: 36px; width: fit-content;
            transition: var(--transition); white-space: nowrap; box-shadow: var(--shadow-xs);
        }
        .auth-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border-color-light); box-shadow: var(--shadow-sm); }
        .auth-btn:active { transform: scale(0.96); }

        /* Welcome */
        .welcome { margin-bottom: 18px; animation: slideUp 0.5s ease; }
        .welcome h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; text-shadow: var(--text-shadow-strong); }
        .welcome p { color: var(--text-secondary); font-size: 0.75rem; margin-top: 4px; text-shadow: var(--text-shadow); }

        /* Search */
        .search-wrap { position: relative; margin-bottom: 18px; }
        .search-wrap input {
            width: 100%; padding: 11px 42px 11px 38px; border-radius: 12px; border: 1px solid var(--border-color);
            background: var(--bg-card); color: var(--text-primary); font-size: 0.72rem; outline: none;
            box-shadow: var(--shadow-sm); transition: var(--transition);
        }
        .search-wrap input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,180,216,0.08), var(--shadow-md); }
        .search-wrap .s-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.8rem; }
        .search-wrap .clear-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: var(--bg-input); border: none; width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0;
            transition: var(--transition); color: var(--text-muted); font-size: 0.6rem;
        }
        .search-wrap .clear-btn.show { opacity: 1; }

        /* Section Title */
        .section-title {
            font-size: 0.6rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
        .section-title i { color: var(--cyan); font-size: 0.7rem; text-shadow: var(--text-shadow); }

        /* Game Grid */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .game-item {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            padding: 22px 14px 16px; text-align: center; cursor: pointer; transition: var(--transition);
            box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .game-item:hover { background: var(--bg-card-hover); border-color: var(--border-color-light); box-shadow: var(--shadow-md); }
        .game-item:active { transform: scale(0.96); }
        .game-item.selected { background: var(--accent); border-color: var(--accent); box-shadow: var(--shadow-lg); }
        .game-item.selected .line1, .game-item.selected .line2 { color: #ffffff; }
        .game-item.selected .game-icon { color: #ffffff; text-shadow: 0 1px 3px rgba(255,255,255,0.3); }
        .game-item.hidden { display: none; }
        .game-icon { font-size: 2.5rem; color: var(--cyan); text-shadow: var(--text-shadow); }
        .game-item .line1 { font-weight: 700; font-size: 0.75rem; color: var(--text-primary); text-shadow: var(--text-shadow); }
        .game-item .line2 { font-size: 0.5rem; color: var(--text-muted); text-shadow: var(--text-shadow); }
        .bounce-click { animation: bounceClick 0.35s ease; }

        /* Footer */
        .footer-text { text-align: center; color: var(--text-muted); font-size: 0.45rem; margin-top: 12px; opacity: 0.6; text-shadow: var(--text-shadow); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 440px; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            display: flex; justify-content: space-around; align-items: center;
            padding: 5px 6px; z-index: 100; box-shadow: var(--shadow-xl);
        }
        .nav-item {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 16px; border-radius: var(--radius-pill); cursor: pointer;
            transition: var(--transition); color: var(--text-muted); font-size: 1.1rem;
            text-decoration: none; border: none; background: transparent; white-space: nowrap; min-width: 44px;
        }
        .nav-item:hover:not(.active) { color: var(--text-secondary); background: var(--bg-card-hover); }
        .nav-item:active { transform: scale(0.94); }
        .nav-item.active { background: var(--nav-dark); color: #ffffff; font-size: 0.85rem; padding: 10px 20px 10px 16px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
        .nav-item.active i { font-size: 1rem; }
        .nav-label { display: none; font-weight: 600; letter-spacing: 0.3px; }
        .nav-item.active .nav-label { display: inline-block; }

        /* Toast */
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--bg-card); padding: 12px 24px; border-radius: 12px;
            border: 1px solid var(--border-color); color: var(--text-primary); font-weight: 500;
            font-size: 0.75rem; display: none; z-index: 200; text-align: center;
            max-width: 90%; box-shadow: var(--shadow-lg);
        }
        .toast.show { display: block; animation: toastPop 0.35s cubic-bezier(0.34,1.56,0.64,1); }

        @media (max-width: 360px) {
            .game-grid { gap: 8px; }
            .game-item { padding: 18px 10px 14px; }
        }
        @media (min-width: 768px) {
            .container { max-width: 560px; }
            .bottom-nav { max-width: 520px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <div class="logo-wrap">
                    <img src="https://i.postimg.cc/zXBdB1xK/IMG-20260710-124320-224.jpg" alt="Logo" width="38" height="38">
                    <div class="logo-text-group">
                        <span class="logo-premium gradient-text" id="appName">Premium</span>
                        <span class="logo-sub" id="appSub">Game Shop</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <a href="notifications.html" class="icon-btn"><i class="fas fa-bell"></i><span class="badge" id="notiBadge">0</span></a>
                <button class="lang-toggle" id="langToggle">MM</button>
                <button class="auth-btn" id="authBtn"><i class="fas fa-key"></i> Login</button>
            </div>
        </header>

        <section class="welcome">
            <h1 class="gradient-text" id="pageTitle">Shop</h1>
            <p id="pageSubShop">Choose a game and purchase packages</p>
        </section>

        <div class="search-wrap">
            <span class="s-icon"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" placeholder="Search game name..." autocomplete="off">
            <button class="clear-btn" id="clearBtn" onclick="clearSearch()"><i class="fas fa-times"></i></button>
        </div>

        <div class="section-title"><i class="fas fa-gamepad"></i> <span id="gamesTitle">Games</span></div>
        <div class="game-grid" id="gameGrid">
            <div class="game-item" data-name="mobile legends mlbb">
                <span class="game-icon"><i class="fas fa-gamepad"></i></span>
                <span class="line1">Mobile Legends</span>
                <span class="line2">MLBB</span>
            </div>
            <div class="game-item" data-name="coming soon">
                <span class="game-icon"><i class="fas fa-clock"></i></span>
                <span class="line1" id="cs1">Coming Soon</span>
                <span class="line2" id="cs2">Coming Soon</span>
            </div>
        </div>

        <p class="footer-text">&copy; 2026 Premium Game Shop</p>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span class="nav-label" id="navHome">Home</span></a>
        <a href="shop.html" class="nav-item active"><i class="fas fa-shopping-bag"></i><span class="nav-label" id="navShop">Shop</span></a>
        <a href="payment.html" class="nav-item"><i class="fas fa-credit-card"></i><span class="nav-label" id="navPayment">Payment</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span class="nav-label" id="navProfile">Profile</span></a>
    </nav>

    <div class="toast" id="toast"></div>

    <script>
        const LANG_DATA = {
            my: {
                appName:'Premium',appSub:'Game Shop',home:'ပင်မ',shop:'ဆိုင်',payment:'ငွေပေးချေ',profile:'ပရိုဖိုင်',
                pageTitle:'ဆိုင်',pageSubShop:'ဂိမ်းတစ်ခုရွေးပြီး ပက်ကေ့ခ်ျများကို ဝယ်ယူလိုက်ပါ',
                gamesTitle:'ဂိမ်းများ',comingSoon:'Coming Soon',searchPlaceholder:'ဂိမ်းနာမည်ရှာပါ...',
                selectGame:'ရွေးချယ်လိုက်ပါ',cs1:'Coming Soon',cs2:'Coming Soon'
            },
            en: {
                appName:'Premium',appSub:'Game Shop',home:'Home',shop:'Shop',payment:'Payment',profile:'Profile',
                pageTitle:'Shop',pageSubShop:'Choose a game and purchase packages',
                gamesTitle:'Games',comingSoon:'Coming Soon',searchPlaceholder:'Search game name...',
                selectGame:'Selected',cs1:'Coming Soon',cs2:'Coming Soon'
            }
        };
        let currentLang = localStorage.getItem('lang') || 'en';
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');

        function getText(k) { return LANG_DATA[currentLang]?.[k] || k; }
        function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500); }
        function updateBadge() { const n=JSON.parse(localStorage.getItem('notifications')||'[]'); const c=n.filter(x=>x.status==='pending').length; const b=document.getElementById('notiBadge'); if(b) { b.style.display=c>0?'flex':'none'; if(c>0)b.textContent=c>99?'99+':c; } }
        function toggleLang() { currentLang = currentLang === 'en' ? 'my' : 'en'; localStorage.setItem('lang', currentLang); updateLanguage(); }
        function updateLanguage() {
            const d = LANG_DATA[currentLang];
            document.getElementById('langToggle').textContent = currentLang === 'en' ? 'MM' : 'EN';
            ['appName','appSub','pageTitle','pageSubShop','gamesTitle','cs1','cs2','navHome','navShop','navPayment','navProfile'].forEach(id => { const el = document.getElementById(id); if(el && d[id]) el.textContent = d[id]; });
            document.getElementById('searchInput').placeholder = d.searchPlaceholder;
        }
        function updateAuthUI() { const btn = document.getElementById('authBtn'); if(!btn) return; if(currentUser) { btn.style.display='none'; } else { btn.style.display='inline-flex'; btn.innerHTML='<i class="fas fa-key"></i> Login'; } }

        function searchGames(q) {
            const ql = q.toLowerCase().trim();
            document.querySelectorAll('.game-item').forEach(item => {
                const n = item.dataset.name || '';
                item.classList.toggle('hidden', ql !== '' && !n.includes(ql));
            });
            document.getElementById('clearBtn').classList.toggle('show', ql.length > 0);
        }
        function clearSearch() { document.getElementById('searchInput').value=''; searchGames(''); }
        function selectGame(gn, gi, ev) {
            ev.currentTarget.classList.add('bounce-click');
            setTimeout(() => ev.currentTarget.classList.remove('bounce-click'), 350);
            localStorage.setItem('selectedGame', JSON.stringify({ name: gn, id: gi }));
            setTimeout(() => { window.location.href = gi === 'mlbb' ? 'mlbb-packages.html' : 'mcgg-packages.html'; }, 500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            currentLang = localStorage.getItem('lang') || 'en';
            const su = localStorage.getItem('currentUser'); if(su) currentUser = JSON.parse(su);
            updateLanguage(); updateBadge(); updateAuthUI();

            document.getElementById('langToggle').addEventListener('click', toggleLang);
            document.getElementById('authBtn').addEventListener('click', () => { currentUser ? window.location.href='profile.html' : window.location.href='index.html'; });
            document.getElementById('searchInput').addEventListener('input', function() { searchGames(this.value); });
            document.querySelectorAll('.game-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    const lines = this.querySelectorAll('.line1,.line2');
                    const gn = lines[0]?.textContent + ' ' + lines[1]?.textContent;
                    const gi = this.dataset.name.includes('mlbb') ? 'mlbb' : this.dataset.name.includes('mcgg') ? 'mcgg' : null;
                    if (gi) selectGame(gn.trim(), gi, e);
                });
            });
        });
    </script>
</body>
</html>
