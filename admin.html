<!DOCTYPE html>
<html>
<head><title>Admin – Premium Game Shop</title><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="container">
    <h1>Admin Dashboard</h1>
    <section id="adminShopHours">
      <h2>Shop Hours</h2>
      <label>Opening Time <input type="time" id="openTime" /></label>
      <label>Closing Time <input type="time" id="closeTime" /></label>
      <button class="btn btn-primary" id="saveHours">Save</button>
    </section>
    <section id="adminProducts">
      <h2>Products</h2>
      <button class="btn btn-primary" id="addProduct">Add Product</button>
      <div id="adminProductList"></div>
    </section>
    <section id="adminOrders">
      <h2>Orders</h2>
      <div id="adminOrderList"></div>
    </section>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
